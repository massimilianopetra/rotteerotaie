<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotaie &amp; Rotte — strategia dei trasporti</title>
  <meta name="description" content="Gioco di strategia dei trasporti nel browser: ferrovie, strade, autostrade e aeroporti fra città che crescono.">
  <link rel="icon" href="icona.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/stile.css">
</head>
<body>
  <header id="barra">
    <span class="logo">🚂 Rotaie &amp; Rotte</span>
    <span id="azienda"></span>
    <span id="soldi" title="Cassa"></span>
    <span id="prestito" class="link" data-az="finestra" data-f="banca" title="Banca: prestiti e tassi (K)"></span>
    <span id="quadroBarra" class="link" data-az="finestra" data-f="finanze" title="Quadro di gestione: conti, grafici, mezzi e merci (E)"></span>
    <span class="spazio"></span>
    <span id="data"></span>
    <span id="velocita">
      <button data-az="vel" data-v="0" title="Pausa (spazio)">⏸</button>
      <button data-az="vel" data-v="1" title="Normale: 1 secondo = 5 minuti (1)">▶</button>
      <button data-az="vel" data-v="2" title="Veloce: 1 secondo = 1 ora (2)">⏩</button>
      <button data-az="vel" data-v="3" title="Velocissimo: 1 secondo = 1 giorno (3)">⏭</button>
      <button data-az="vel" data-v="4" title="Turbo: 1 secondo = 1 settimana (4)">🚀</button>
    </span>
    <span class="spazio"></span>
    <button id="pulsanteMappa" data-az="menuMappa" title="Livelli della mappa: cosa mostrare (L)">🗺️<span class="etb"> Mappa</span></button>
    <button data-az="finestra" data-f="veicoli" title="Mezzi (V)">🚂<span class="etb"> Mezzi</span></button>
    <button data-az="finestra" data-f="mondo" title="Città, industrie e stazioni (M)">🏙️<span class="etb"> Mondo</span></button>
    <button data-az="finestra" data-f="finanze" title="Quadro di gestione: conti, grafici, mezzi e merci (E)">📊<span class="etb"> Gestione</span></button>
    <button data-az="finestra" data-f="banca" title="Banca: prestiti a tasso fisso o variabile (K)">🏦<span class="etb"> Banca</span></button>
    <button data-az="finestra" data-f="menu" title="Nuova partita, salva, carica">💾<span class="etb"> Partita</span></button>
    <button data-az="finestra" data-f="aiuto" title="Aiuto (H)">❓</button>
    <button data-az="finestra" data-f="info" title="Informazioni: autore, versione e build">ℹ️</button>
  </header>

  <nav id="attrezzi"></nav>
  <div id="menuStazioni" class="nascosto"></div>
  <div id="menuMappa" class="nascosto"></div>
  <canvas id="mappa"></canvas>
  <aside id="pannello" class="nascosto"></aside>
  <div id="notizie"></div>
  <canvas id="mini" title="Clic per spostarti"></canvas>

  <div id="finestra" class="nascosto">
    <div class="riquadro">
      <div class="testa"><span></span><button class="chiudi" data-az="chiudiFinestra" title="Chiudi (Esc)">✕</button></div>
      <div class="corpo"></div>
    </div>
  </div>
  <div id="avviso"></div>
  <div id="suggerimento"></div>

  <!-- solo script classici: il gioco funziona anche aprendo il file con un doppio clic -->
  <script src="js/versione.js"></script>
  <script src="dati/catalogo.js"></script>
  <script src="js/casuale.js"></script>
  <script src="js/mappa.js"></script>
  <script src="js/rete.js"></script>
  <script src="js/circolazione.js"></script>
  <script src="js/economia.js"></script>
  <script src="js/veicoli.js"></script>
  <script src="js/disegno.js"></script>
  <script src="js/interfaccia.js"></script>
  <script src="js/gestione.js"></script>
  <script src="js/banca.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
